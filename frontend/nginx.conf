# ============================================================
# CivicPulse AI — Nginx Configuration
# Serves the React/Vite production build as a SPA
# ============================================================

server {
    listen 80;
    server_name localhost;

    # Serve static files from the build output directory
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # SPA fallback routing:
    # All routes (/, /citizen/login, /government, etc.) fall back to index.html
    # so React Router can handle client-side navigation without 404 errors.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (JS/CSS/images have content-hashed names)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Disable nginx version in error responses
    server_tokens off;
}
